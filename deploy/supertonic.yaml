# Supertonic 3 TTS backend (ONNX, CPU-only). Optional — skip if you point
# SVA_TTS_ENDPOINT at an existing Supertonic/TTS service.
# Apply with:  oc apply -f supertonic.yaml -n <namespace>
# then:        oc start-build supertonic --from-dir=../supertonic --follow -n <namespace>
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: supertonic
  labels: { app: supertonic }
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: supertonic
  labels: { app: supertonic }
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: supertonic:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supertonic
  labels: { app: supertonic }
  annotations:
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"supertonic:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"tts\")].image"}]
spec:
  replicas: 1
  strategy: { type: Recreate }   # never run old+new pods together (avoids test races)
  selector:
    matchLabels: { app: supertonic }
  template:
    metadata:
      labels: { app: supertonic }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: tts
          image: supertonic:latest   # patched by the ImageStream trigger
          imagePullPolicy: Always     # :latest — always re-pull the new push on restart
          ports:
            - { name: http, containerPort: 7788 }
          env:
            # CRITICAL: pin onnxruntime threads to the CPU limit. Left on auto,
            # onnxruntime spawns one thread per HOST core (dozens on GPU nodes)
            # while the pod is capped at `limits.cpu` → thread thrashing makes a
            # 3s synth take 40-70s → the router 30s-times-out with 504. Keep this
            # number EQUAL to limits.cpu below.
            - { name: SUPERTONIC_INTRA_OP_THREADS, value: "8" }
            - { name: SUPERTONIC_INTER_OP_THREADS, value: "1" }
            - { name: OMP_NUM_THREADS,             value: "8" }
          # Weights are baked into the image (no runtime download), so startup is
          # just model load — but keep headroom for slow nodes.
          startupProbe:
            httpGet: { path: /docs, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /docs, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: "2", memory: 1Gi }
            limits:   { cpu: "8", memory: 2Gi }   # keep == SUPERTONIC_INTRA_OP_THREADS
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: supertonic
  labels: { app: supertonic }
spec:
  selector: { app: supertonic }
  ports:
    - { name: http, port: 7788, targetPort: http }
