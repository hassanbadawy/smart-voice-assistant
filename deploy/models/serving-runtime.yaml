# Shared vLLM (Red Hat AI Inference Server) ServingRuntime for KServe.
# Reused by both the Whisper (STT) and Ministral (LLM) InferenceServices.
# Apply with:  oc apply -f serving-runtime.yaml -n <namespace>
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-cuda
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    openshift.io/display-name: vLLM NVIDIA GPU ServingRuntime (KServe)
spec:
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      # Red Hat AI Inference Server (productised vLLM). This MUST match your
      # cluster's RHOAI version + GPU driver — a mismatched image fails with
      # CUDA "error 803" or unknown-architecture errors. The install scripts
      # auto-detect the right image from your cluster's built-in template:
      #   oc get template vllm-cuda-runtime-template -n redhat-ods-applications \
      #     -o jsonpath='{.objects[0].spec.containers[0].image}'
      # The value below is that image for RHOAI on this cluster; override as needed.
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:5800e12b2a465f15961fcf34b645d79ed4f91ec9161eab22b1205d12682183c8
      command:
        - python
        - "-m"
        - vllm.entrypoints.openai.api_server
      args:
        - "--port=8080"
        - "--model=/mnt/models"
        - "--served-model-name={{.Name}}"   # served model id == InferenceService name
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      ports:
        - containerPort: 8080
          protocol: TCP
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
